
services:
  db:
    image: postgres:15-alpine
    container_name: location-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: location
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: location-service
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://user:password@db:5432/location?sslmode=disable
    ports:
      - "8085:8080"
    command: ["./location-service"]

  adminer:
    image: adminer
    restart: always
    ports:
      - "8088:8080"

volumes:
  db_data:
